<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARKOBOMBS | Sign In</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"DM Sans",sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    overflow:hidden;

    background:
        radial-gradient(circle at top left,#F6C5E8,transparent 35%),
        radial-gradient(circle at bottom right,#D8C5FF,transparent 35%),
        linear-gradient(135deg,#FCE8F7,#F6F0FF,#EAF3FF);
}

/* Floating background blobs */

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(10px);
    opacity:.45;
}

.blob.one{
    width:260px;
    height:260px;
    background:#E879F9;
    top:-80px;
    left:-60px;
}

.blob.two{
    width:320px;
    height:320px;
    background:#A78BFA;
    bottom:-120px;
    right:-80px;
}

.blob.three{
    width:180px;
    height:180px;
    background:#C4B5FD;
    top:120px;
    right:120px;
}

.login-card{
    position:relative;
    z-index:2;

    width:100%;
    max-width:470px;

    padding:42px;

    border-radius:34px;

    background:rgba(255,255,255,.78);
    backdrop-filter:blur(22px);

    border:1px solid rgba(255,255,255,.85);

    box-shadow:0 30px 70px rgba(94,61,170,.18);
}

/* Logo */

.logo{
    width:76px;
    height:76px;
    margin:auto;

    border-radius:24px;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:34px;
    font-weight:800;

    background:linear-gradient(135deg,#A855F7,#6366F1);

    box-shadow:0 18px 35px rgba(124,92,255,.28);
}

.brand{
    text-align:center;
    margin-top:18px;
}

.brand h1{
    font-family:"Playfair Display",serif;
    color:#5627B5;
    font-size:44px;
    letter-spacing:-1px;
}

.brand p{
    margin-top:8px;
    color:#74688F;
    font-size:13px;
    line-height:1.6;
}

/* Google Button */

.google-btn{
    width:100%;
    margin-top:32px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;

    padding:15px 18px;

    border-radius:18px;
    border:1.5px solid #ECE6FF;

    background:white;

    cursor:pointer;

    transition:.25s;
}

.google-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 28px rgba(124,92,255,.12);
}

.google-icon{
    width:26px;
    height:26px;
    border-radius:50%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:18px;
    color:#4285F4;
}

.google-btn span{
    font-weight:700;
    color:#43326E;
}

/* Divider */

.divider{
    display:flex;
    align-items:center;
    gap:14px;
    margin:28px 0;
}

.divider hr{
    flex:1;
    border:none;
    border-top:1px solid #ECE7FB;
}

.divider span{
    color:#A59CBF;
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
}

/* Input */

label{
    font-size:12px;
    font-weight:700;
    color:#5C4B86;
}

.input{
    width:100%;
    margin-top:8px;

    padding:15px 18px;

    border-radius:16px;
    border:1.5px solid #E8E2FA;

    background:#FCFBFF;

    font-size:14px;
    color:#2E2353;
    outline:none;

    transition:.25s;
}

.input:focus{
    border-color:#8B5CF6;
    box-shadow:0 0 0 4px rgba(139,92,246,.12);
}

/* Sign In Button */

.login-btn{
    width:100%;
    margin-top:24px;

    border:none;

    padding:16px;

    border-radius:18px;

    background:linear-gradient(135deg,#A855F7,#6366F1);

    color:white;

    font-size:15px;
    font-weight:800;

    cursor:pointer;

    transition:.25s;

    box-shadow:0 15px 28px rgba(124,92,255,.22);
}

.login-btn:hover{
    transform:translateY(-3px);
}

.note{
    margin-top:18px;
    text-align:center;
    font-size:11px;
    color:#887E9F;
    line-height:1.6;
}

/* Loading Overlay */

.loading{
    position:fixed;
    inset:0;

    background:rgba(248,246,255,.95);

    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:999;
}

.spinner{
    width:70px;
    height:70px;

    border-radius:50%;

    border:6px solid #E8DEFF;
    border-top:6px solid #7C5CFF;

    animation:spin .9s linear infinite;
}

.loading h2{
    margin-top:25px;
    color:#592BC0;
    font-family:"Playfair Display",serif;
    font-size:28px;
}

.loading p{
    margin-top:8px;
    color:#74698E;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* Back */

.back{
    display:inline-block;
    margin-top:28px;
    text-decoration:none;
    color:#7658C5;
    font-weight:700;
    font-size:13px;
}
</style>
</head>
<body>

<div class="blob one"></div>
<div class="blob two"></div>
<div class="blob three"></div>

<div class="login-card">

    <div class="logo">A</div>

    <div class="brand">
        <h1>ARKOBOMBS</h1>
        <p>
            Academic Announcement & Readiness Platform
            <br>
            Sign in to continue to your dashboard.
        </p>
    </div>

    <button class="google-btn" onclick="googleFill()">
        <div class="google-icon">G</div>
        <span>Continue with Google</span>
    </button>

    <div class="divider">
        <hr><span>OR</span><hr>
    </div>

    <label>Email Address</label>
    <input
        type="email"
        id="email"
        class="input"
        placeholder="Enter your Google email..."
    >

    <button class="login-btn" onclick="loginPortal()">
        Sign In →
    </button>

    <div class="note">
        Demo login for CODEFEST 2026.
        <br>
        Teacher and Student dashboards use different email accounts.
    </div>

    <a href="index.html" class="back">← Back to Homepage</a>

</div>

<!-- Loading Screen -->

<div class="loading" id="loading">

    <div class="spinner"></div>

    <h2>Signing in...</h2>

    <p>Preparing your ARKOBOMBS workspace.</p>

</div>

<script>
function googleFill(){

    document.getElementById("email").focus();

}

function loginPortal(){

    const email=document.getElementById("email").value.trim().toLowerCase();

    if(email===""){
        alert("Please enter your Google email.");
        return;
    }

    document.getElementById("loading").style.display="flex";

    setTimeout(()=>{

        /* ---------- Teacher Accounts ---------- */

        if(
            email.includes("teacher") ||
            email.includes("prof") ||
            email==="teacher@gmail.com" ||
            email==="teacher@arkobombs.edu"
        ){

            window.location.href="Teacher%20Enhanced.html";
            return;

        }

        /* ---------- Student Accounts ---------- */

        window.location.href="students.html";

    },1800);

}
</script>

</body>
</html>
