<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARKOBOMBS | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"DM Sans",sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top left,#FAD7E9,transparent 35%),
        radial-gradient(circle at bottom right,#DDD6FE,transparent 35%),
        linear-gradient(135deg,#FFF8FD,#F5F1FF,#EEF4FF);
    padding:25px;
}

.login-card{
    width:100%;
    max-width:430px;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.8);
    border-radius:34px;
    padding:38px 34px;
    box-shadow:0 25px 60px rgba(124,92,255,.15);
}

.logo{
    width:64px;
    height:64px;
    border-radius:20px;
    background:linear-gradient(135deg,#A855F7,#6366F1);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:28px;
    font-weight:800;
    margin:auto;
    box-shadow:0 12px 30px rgba(124,92,255,.25);
}

.brand{
    text-align:center;
    margin-top:18px;
}

.brand h1{
    font-family:"Playfair Display",serif;
    color:#5423B2;
    font-size:36px;
}

.brand p{
    margin-top:6px;
    color:#7B7398;
    font-size:13px;
}

.divider{
    width:70px;
    height:4px;
    background:linear-gradient(90deg,#A855F7,#6366F1);
    border-radius:20px;
    margin:24px auto 30px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:12px;
    font-weight:700;
    color:#564C74;
}

input{
    width:100%;
    padding:15px 16px;
    border-radius:15px;
    border:1px solid #E6DEFF;
    background:#FBFAFF;
    font-size:14px;
    margin-bottom:18px;
    outline:none;
}

input:focus{
    border-color:#7C5CFF;
    box-shadow:0 0 0 4px rgba(124,92,255,.12);
}

.role-title{
    margin:8px 0 14px;
    font-size:12px;
    font-weight:700;
    color:#655B83;
}

.roles{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:25px;
}

.role{
    border:2px solid #ECE8FF;
    border-radius:18px;
    padding:18px 14px;
    text-align:center;
    cursor:pointer;
    transition:.25s;
    background:white;
}

.role:hover{
    transform:translateY(-3px);
}

.role.active{
    border-color:#7C5CFF;
    background:linear-gradient(135deg,#F5F0FF,#EEE8FF);
    box-shadow:0 10px 24px rgba(124,92,255,.15);
}

.role .icon{
    font-size:30px;
}

.role h3{
    margin-top:10px;
    font-size:14px;
    color:#5121AD;
}

.role span{
    display:block;
    margin-top:5px;
    font-size:11px;
    color:#7B7398;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,#A855F7,#6366F1);
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 12px 25px rgba(124,92,255,.25);
    transition:.25s;
}

button:hover{
    transform:translateY(-2px);
}

.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#6A45D4;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
}

.demo{
    margin-top:24px;
    background:#F7F5FF;
    border-radius:16px;
    padding:15px;
    font-size:12px;
    color:#655B83;
    line-height:1.6;
}

.demo strong{
    color:#5121AD;
}

@media(max-width:480px){

.roles{
    grid-template-columns:1fr;
}

.login-card{
    padding:30px 22px;
}

.brand h1{
    font-size:30px;
}

}
</style>
</head>
<body>

<div class="login-card">

    <div class="logo">A</div>

    <div class="brand">
        <h1>ARKOBOMBS</h1>
        <p>Academic Announcement & Readiness Platform</p>
    </div>

    <div class="divider"></div>

    <label>Email Address</label>
    <input id="email" type="email" placeholder="Enter your email">

    <label>Password</label>
    <input id="password" type="password" placeholder="Enter your password">

    <div class="role-title">Choose your portal</div>

    <div class="roles">

        <div class="role active" id="studentRole">
            <div class="icon">🎓</div>
            <h3>Student</h3>
            <span>Student Dashboard</span>
        </div>

        <div class="role" id="teacherRole">
            <div class="icon">👩‍🏫</div>
            <h3>Teacher</h3>
            <span>Teacher Portal</span>
        </div>

    </div>

    <button id="loginBtn">Sign In →</button>

    <div class="demo">
        <strong>Demo Login</strong><br><br>

        🎓 Student<br>
        student@arkobombs.edu<br>
        Password: Student2026

        <br><br>

        👩‍🏫 Teacher/Admin<br>
        teacher@arkobombs.edu<br>
        Password: Teacher2026
    </div>

    <a href="index.html" class="back">← Back to Homepage</a>

</div>

<script>
let selectedRole = "student";

const studentRole = document.getElementById("studentRole");
const teacherRole = document.getElementById("teacherRole");

studentRole.onclick = () => {
    selectedRole = "student";
    studentRole.classList.add("active");
    teacherRole.classList.remove("active");
};

teacherRole.onclick = () => {
    selectedRole = "teacher";
    teacherRole.classList.add("active");
    studentRole.classList.remove("active");
};

document.getElementById("loginBtn").onclick = () => {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if(email === "" || password === ""){
        alert("Please enter your email and password.");
        return;
    }

    if(selectedRole === "student"){
        if(email === "student@arkobombs.edu" && password === "Student2026"){
            window.location.href = "students.html";
        }else{
            alert("Invalid Student Account.");
        }
    }

    if(selectedRole === "teacher"){
        if(email === "teacher@arkobombs.edu" && password === "Teacher2026"){
            window.location.href = "Teacher Enhanced.html";
        }else{
            alert("Invalid Teacher/Admin Account.");
        }
    }
};
</script>

</body>
</html>
