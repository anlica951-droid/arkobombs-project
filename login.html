<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARKOBOMBS | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:"DM Sans",sans-serif;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
background:
radial-gradient(circle at top left,#FFD8EF,transparent 35%),
radial-gradient(circle at bottom right,#DDD6FE,transparent 35%),
linear-gradient(135deg,#FFF8FD,#F5F1FF,#EEF5FF);
}

.login-card{
width:100%;
max-width:440px;
background:rgba(255,255,255,.85);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.8);
border-radius:32px;
padding:38px 34px;
box-shadow:0 25px 60px rgba(124,92,255,.15);
}

.logo{
width:70px;
height:70px;
margin:auto;
border-radius:22px;
background:linear-gradient(135deg,#A855F7,#6366F1);
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:800;
color:white;
box-shadow:0 12px 30px rgba(124,92,255,.25);
}

h1{
margin-top:18px;
text-align:center;
font-family:"Playfair Display",serif;
font-size:34px;
color:#5222AD;
}

.subtitle{
text-align:center;
margin-top:8px;
font-size:13px;
color:#756F8E;
line-height:1.6;
margin-bottom:28px;
}

label{
display:block;
margin-bottom:8px;
font-size:12px;
font-weight:700;
color:#564C73;
}

input{
width:100%;
padding:15px 16px;
border-radius:14px;
border:1px solid #E7E0FF;
background:#FBFAFF;
font-size:14px;
margin-bottom:18px;
outline:none;
transition:.2s;
}

input:focus{
border-color:#7C5CFF;
box-shadow:0 0 0 4px rgba(124,92,255,.12);
}

.role-title{
margin-bottom:12px;
font-size:12px;
font-weight:700;
color:#6B6486;
}

.roles{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-bottom:28px;
}

.role-card{
padding:18px 14px;
text-align:center;
border-radius:18px;
border:2px solid #ECE8FF;
background:white;
cursor:pointer;
transition:.25s;
}

.role-card:hover{
transform:translateY(-3px);
}

.role-card.active{
border-color:#7C5CFF;
background:linear-gradient(135deg,#F5F0FF,#EEE8FF);
box-shadow:0 12px 24px rgba(124,92,255,.12);
}

.role-card .emoji{
font-size:30px;
}

.role-card h3{
margin-top:10px;
font-size:15px;
color:#5222AD;
}

.role-card p{
margin-top:6px;
font-size:11px;
color:#7B7396;
line-height:1.4;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#A855F7,#6366F1);
color:white;
font-size:15px;
font-weight:700;
cursor:pointer;
box-shadow:0 12px 24px rgba(124,92,255,.25);
transition:.25s;
}

button:hover{
transform:translateY(-2px);
}

.note{
margin-top:22px;
padding:16px;
background:#F8F5FF;
border-radius:16px;
text-align:center;
font-size:12px;
color:#6C6585;
line-height:1.6;
}

.back{
display:block;
text-align:center;
margin-top:18px;
text-decoration:none;
font-size:13px;
font-weight:700;
color:#6A45D4;
}

@media(max-width:500px){
.roles{
grid-template-columns:1fr;
}

.login-card{
padding:30px 22px;
}
}
</style>
</head>
<body>

<div class="login-card">

<div class="logo">A</div>

<h1>ARKOBOMBS</h1>

<div class="subtitle">
Academic Announcement & Readiness Platform<br>
Sign in to continue.
</div>

<label>Email Address</label>
<input id="email" type="email" placeholder="Enter any Gmail">

<label>Password</label>
<input id="password" type="password" placeholder="Enter any password">

<div class="role-title">Choose your portal</div>

<div class="roles">

<div id="studentRole" class="role-card active">
<div class="emoji">🎓</div>
<h3>Student</h3>
<p>Open Student Dashboard</p>
</div>

<div id="teacherRole" class="role-card">
<div class="emoji">👩‍🏫</div>
<h3>Teacher / Admin</h3>
<p>Open Teacher Portal</p>
</div>

</div>

<button id="loginBtn">Sign In →</button>

<div class="note">
<b>CODEFEST DEMO LOGIN</b><br>
Type <b>any Gmail</b> and <b>any password</b>.<br>
Choose Student or Teacher, then Sign In.
</div>

<a href="index.html" class="back">← Back to Homepage</a>

</div>

<script>
// =======================================
// FAKE LOGIN FOR CODEFEST (NO VALIDATION)
// =======================================

let selectedRole = "student";

const studentRole = document.getElementById("studentRole");
const teacherRole = document.getElementById("teacherRole");

studentRole.onclick = () => {
selectedRole = "student";
studentRole.classList.add("active");
teacherRole.classList.remove("active");
};

teacherRole.onclick = () => {
selectedRole = "teacher";
teacherRole.classList.add("active");
studentRole.classList.remove("active");
};

document.getElementById("loginBtn").onclick = () => {

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value.trim();

if(email === "" || password === ""){
alert("Please enter any email and any password.");
return;
}

// Save fake login (optional)
localStorage.setItem("arkobombsLoggedIn","true");
localStorage.setItem("arkobombsRole",selectedRole);
localStorage.setItem("arkobombsUser",email);

// Redirect by role
if(selectedRole === "teacher"){
window.location.href = "Teacher Enhanced.html";
}else{
window.location.href = "students.html";
}

};
</script>

</body>
</html>
